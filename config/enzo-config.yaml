# ═══════════════════════════════════════════════════════════════════════════
#  ENZO — ملف الإعدادات / configuration
#
#  هذا الملف هو المصدر الوحيد للحقيقة. يُقرأ بالكامل عند كل دورة.
#  This file is the single source of truth and is re-read every cycle.
#
#  ⚠  المسافة البادئة (الـ indentation) مهمة في YAML. لا تستخدم Tab.
#     Indentation matters in YAML — use spaces, never tabs.
#
#  بعد أي تعديل:   ./enzoctl doctor     للتحقق
#                  ./enzoctl restart    لتطبيقه
#  After editing:  ./enzoctl doctor  then  ./enzoctl restart
# ═══════════════════════════════════════════════════════════════════════════

# false = تداول حقيقي بأموال حقيقية.  true = محاكاة بلا أموال.
# false = LIVE real-money trading.  true = paper simulation.
# للتبديل بسرعة:  ./enzoctl mode live   |   ./enzoctl mode paper
paper_mode: false
risk_management:
  risk_per_trade: 2.5
  max_exposure: 30.0
  max_daily_loss: 8.0
  max_drawdown: 25.0
  enable_risk_halts: true
  consecutive_losses_limit: 12
  max_open_positions: 5
  exit_monitor_interval_seconds: 1
  circuit_breaker_drop_pct: 15.0
exit_monitor:
  enabled: true
  interval_seconds: 2.0
  max_stale_age_seconds: 10.0
  failure_threshold: 3
  price_sources:
  - pumpdev
  - gmgn
  - bonding_curve
  never_auto_sell_on_failure: true
  # كم دورة ننتظر قبل تكرار تسجيل نفس تحذير "سعر قديم".
  # Was 1 line per 2s cycle -> 12,110 rows flooding the audit log and making
  # the dashboard re-parse a 4.7 MB file every 10 seconds.
  # How many cycles to wait before repeating the same stale-price warning.
  stale_event_log_every_n_cycles: 30
# ── بوابات جودة السوق / Market quality gates ─────────────────────────────────
# أي عملة تحت هذه الحدود تُرفض قبل حساب الثقة (بوابة صلبة، ليست تخفيض نقاط).
# شُدِّدت بتاريخ 2026-09-03 بطلب المالك: سيولة وحجم وقيمة سوقية أعلى،
# مع تخفيف ضغط الشراء من 40% إلى 30%.
# Tightened 2026-09-03 at owner request: higher liquidity/volume/mcap floors,
# buy-pressure eased 40% -> 30%.
market_analysis:
  min_liquidity: 5000          # كان 150  (was 150)
  min_volume: 8000             # كان 50   (was 50)
  min_holders: 10              # بلا تغيير (unchanged)
  min_market_cap: 5000         # كان 1000 (was 1000)
  min_confidence_score: 55     # عتبة الشراء — بلا تغيير (BUY threshold)
  min_buy_pressure: 30         # كان 40   (was 40) — تخفيف مقصود
  max_scam_score: 15           # ⚠ غير مفعّل في الكود — انظر الملاحظة أدناه
  max_holder_percentage: 10.0  # ⚠ غير مفعّل في الكود — انظر الملاحظة أدناه
# ⚠ NOTE / ملاحظة: المفتاحان الأخيران أعلاه لا يقرأهما أي كود حالياً، فتعديلهما
# لا يغيّر سلوك البوت. الحماية الفعلية من التركّز تأتي من security_scan
# (رفض قاطع عند top10 > 85%) ومن list_screen / screen_pump_card.
# The last two keys above are currently DEAD (no code reads them). Real
# concentration protection comes from security_scan (hard reject top10 > 85%)
# and the list_screen / screen_pump_card pre-filters.
scam_detection:
  honeypot_risk_threshold: 0.7
  rug_pull_risk_threshold: 0.7
  fake_liquidity_threshold: 0.7
  fake_volume_threshold: 0.7
  concentrated_holders_threshold: 0.8
  suspicious_ownership_threshold: 0.7
  fake_social_engagement_threshold: 0.7
  bundle_top10_threshold: 60.0
  bundle_single_threshold: 45.0
  bundler_flood_penalty: 30
  sniper_flood_penalty: 15
  rat_flood_penalty: 10
  bundlers_in_top20_penalty: 20
  top10_dumping_penalty: 10
  dev_team_hold_penalty: 15
  dev_factory_penalty: 15
  top70_sniper_hold_penalty: 10
  deep_dangerous_threshold: 15
entry_strategy:
  min_risk_reward_ratio: 2.0
  trend_confirmation_periods: 5
exit_strategy:
  take_profit_percentage: 150.0
  take_profit_stages:
  - pct: 30
    sell: 0.3
  - pct: 70
    sell: 0.3
  - pct: 150
    sell: 0.4
  stop_loss_percentage: 38.0
  trailing_stop_percentage: 40.0
  # ── خروج الركود / Stall exit ───────────────────────────────────────────────
  # MoonPay's pump.fun guide calls this "the most important rule: tokens that
  # pump and flatline rarely re-pump". If the position is up at least
  # stall_min_gain_pct and the market cap has made NO new high for
  # stall_seconds, we take profit instead of waiting to be stopped out.
  # مفعّل بطلب المالك 2026-09-03.
  stall_exit_enabled: true
  stall_min_gain_pct: 15.0
  stall_seconds: 30.0
  max_holding_time_hours: 48
# ── حماية الرغ: ثلاث طبقات أضافها المالك في 2026-09-05 ────────────────────
# طبقة 1: بصمات مطلقة تُرفض عند الدخول (تجميع/محافظ وليدة/مصنع серийный).
#   العملة العضوية لا تحمل هذه البصمات، فالرفض لا يؤجّل دخولاً شرعياً.
# طبقة 3: وقف أضيق (-12%) لأول 10 دقائق، يُطبَّق فقط على دخول حمل أعلاماً؛
#   الدخول النظيف يحتفظ بوقفك -38% ومتحركك -40% بلا أي تغيير.
# طبقة 4: كاشف الرغّ أثناء حدوثه (سحب سيولة/انهيار حاملين/بيع العشرة الكبار)
#   → خروج فوري بغض النظر عن الربح أو الخسارة.
rug_protection:
  fingerprints_enabled: true
  veto_bundlers_top20: 6        # ≥ هذا العدد من الـ bundlers ضمن أعلى 20 = رفض
  veto_snipers_top20: 8
  veto_rats_top20: 5
  veto_avg_wallet_age_days: 3.0 # متوسط عمر محافظ القمة أقل من هذا = رفض
  veto_top10_cur_sells: 25      # العشرة الكبار يبيعون الآن بهذا العدد = رفض
  veto_factory_created: 50      # مع السطر التالي: منشئ серийный ماتت معظم عملاته
  veto_factory_open_ratio: 0.03
  soft_flag_ratio: 0.5          # نصف عتبات الرفض = «علم» يشغّل الطبقة 3
  early_stop_enabled: true
  early_stop_pct: 12.0
  early_stop_window_min: 10.0
  tripwire_enabled: true
  tripwire_poll_sec: 20.0       # كل كم ثانية تُقرأ بصمات المحفظة للمركز المفتوح
  tripwire_liq_pull_pct: 40.0   # سحب ≥40% من سيولة الدخول = صوت
  tripwire_holder_drop_pct: 15.0
  tripwire_top10_sells_jump: 15
  tripwire_min_votes: 2         # صوتان من ثلاثة = خروج فوري

scoring_weights:
  price_action: 0.15
  volume: 0.1
  liquidity: 0.1
  social_momentum: 0.15
  on_chain_activity: 0.2
  scam_indicators: 0.3
logging:
  level: INFO
  log_api_errors: true
  log_network_latency: true
notifications:
  send_decision_notifications: true
  min_confidence_for_notification: 60
  send_scan_summary: true
data_sources:
  gmgn:
    # المصدر الوحيد لبيانات السوق. اسم البرنامج أو مساره الكامل.
    # اتركه "gmgn-cli" إن كان مثبّتاً في PATH، أو ضع المسار الكامل مثل:
    #   cli: /home/you/.npm-global/bin/gmgn-cli
    # The sole market-data source. A bare name (found on PATH) or a full path.
    cli: gmgn-cli
    chain: sol
    request_gap_ms: 350
    discovery:
    - trending
    - trenches
    - smartmoney
    - kol
    max_candidates_per_scan: 40
    max_depth_analyses: 12
    extra_discovery: true
    top_traders: true
  pumpdev:
    enabled: true
    request_gap_ms: 150
    batch_size: 30
    price_refresh_secs: 1.0
    use_kolscan: true
    use_recent: true
    thresholds:
      max_twitter_reuse: 5
      max_telegram_reuse: 5
      max_website_reuse: 5
      dev_hold_hard_pct: 35
      dev_hold_soft_pct: 15
      bundler_hard_pct: 50
      bundler_soft_pct: 30
      sniper_hard: 100
      sniper_soft: 40
      sniper_owned_hard_pct: 40
      top10_hard_pct: 90
      top10_soft_pct: 70
      min_mcap: 5000       # احتياطي فقط — screen_pump_card يفضّل market_analysis.min_market_cap
      min_volume: 8000     # fallback only — kept aligned with market_analysis
      min_holders: 0       # مقصود: عملات pump.fun قبل التخرّج لا تُبلغ عن حامليها بعد
      pre_migration_exempt: true
    penalties:
      bundler_penalty_threshold: 0.3
      bundler_penalty: 25
      twitter_reuse_penalty_threshold: 3
      twitter_reuse_penalty: 20
      telegram_reuse_penalty_threshold: 4
      telegram_reuse_penalty: 10
      banned_penalty: 30
discovery:
  dedupe_window_minutes: 720
  max_tokens_per_scan: 40
  max_depth_tokens_per_cycle: 12
paper_trading:
  initial_capital: 10000.0
  slippage_tolerance: 0.5
pump_monitor:
  interval_sec: 30
  max_candidates: 40
  min_initial_buy_sol: 1.0
  min_analysis_interval_sec: 3
  max_analyses_per_min: 15
weighted_confidence:
  security: 30
  wallet_behavior: 20
  dev_behavior: 20
  momentum: 15
  market_structure: 10
  liquidity: 5
wallet_behavior:
  neutral_score: 50
  weights:
    diversity: 0.4
    concentration: 0.3
    growth: 0.3
    identity: 0.35
dev_behavior:
  neutral_score: 50
  track_ttl_sec: 1800
  sell_threshold_pct: 2.0
  buy_threshold_pct: 2.0
  liq_remove_pct: 0.2
  impact_dev_selling: -30
  impact_dev_buying: 25
  impact_dev_holding: 10
  impact_dev_distributing: 8
  impact_dev_remove_liq: -40
  factory_dev_min_created: 10
  factory_dev_heavy_created: 200
  factory_dev_penalty: 15
  factory_dev_heavy_penalty: 45
  factory_dev_low_open_ratio: 0.1
  factory_dev_low_open_penalty: 15
  factory_dev_no_open_ratio_penalty: 8
  no_big_hits_max_ath_mc: 100000
  no_big_hits_penalty: 10
market_structure:
  neutral_score: 50
  min_sample_interval_sec: 60
  max_samples: 30
position_sizing:
  # ── سلوك الحد الأدنى للصفقة / minimum-trade behaviour ──────────────────
  # true  (الافتراضي) = min_trade_usd أرضية: إذا كان رأس المال صغيراً وجعل
  #   الحجم المحسوب أقل من الحد الأدنى، يُرفع الحجم إلى الحد الأدنى وتُنفَّذ
  #   الصفقة. مثال: رأس مال $2.06 ومخاطرة 4% تعطي $0.04 → تُنفَّذ بـ $1.
  # false = يُرفض التداول وتظهر رسالة SIZE_BELOW_FLOOR.
  #
  # قيد أمان واحد لا يُتجاوز أبداً: لا يمكن للأرضية أن تتخطى ما تملكه
  # المحفظة فعلاً وغير المعرَّض حالياً. فإن كان لديك $0.50 فقط، تُرفض الصفقة
  # برسالة INSUFFICIENT_CAPITAL_FOR_MINIMUM_TRADE — لأن إرسال $1 لا تملكها
  # سيفشل عند التنفيذ.
  #
  # true (default) = min_trade_usd is a FLOOR: when capital is small enough
  #   that the risk-based size falls below it, the size is RAISED to the floor
  #   and the trade still executes. false = reject instead.
  # Note this overrides max_exposure on purpose: on a small wallet a 30% cap is
  # under $1, so enforcing it would make the minimum order unreachable. Every
  # override is logged at WARNING, written to the audit trail, and stored on the
  # position as min_floor_applied + effective_risk_pct.
  min_trade_is_floor: true
  confidence_bands:
  - min: 55
    max: 60
    risk_pct: 1.0
  - min: 61
    max: 70
    risk_pct: 2.0
  - min: 71
    max: 80
    risk_pct: 3.0
  - min: 81
    max: 90
    risk_pct: 4.0
  - min: 91
    max: 100
    risk_pct: 5.0
learning:
  enabled: true
  apply_weight_adjustments: false
  min_samples_for_adjust: 10
cache:
  holder_dist_ttl: 600
chain: sol
execution:
  # اسم المحفظة كما يظهر في:  mp wallet list
  # The wallet name exactly as shown by `mp wallet list`.
  wallet_name: enzo-trading
  # العملة التي نشتري بها. USDC أو SOL.
  # IMPORTANT: MoonPay's own pump.fun sniper guide funds every buy from native
  # SOL (So1111...111) and sells back to SOL. Buying a Solana memecoin from USDC
  # needs an extra USDC->SOL hop inside the route, which is one more place for
  # the quote to fail. If you see NO_ROUTE on tokens that clearly have liquidity,
  # switch this to SOL — but ONLY after the wallet actually holds SOL, because
  # position sizing is now bounded by the base token's own balance
  # (spendable_usd), not by total wallet wealth.
  # base_token: USDC = تشتري بـ USDC | SOL = تشتري بـ SOL (ما توثّقه MoonPay)
  # ⚠ غيّره المالك في 2026-09-04: المحفظة الحقيقية تحمل SOL وليس USDC.
  # مع USDC كان رأس المال القابل للصرف ≈ 0 فرفض البوت كل صفقة.
  # تدفق MoonPay الرسمي لـ pump.fun يموّل الشراء من SOL.
  base_token: SOL
  slippage_bps: 50
  # أصغر صفقة يُسمح بإرسالها. أي حجم أقل من هذا يُرفض قبل التنفيذ.
  # Smallest order allowed; anything below is rejected before it is sent.
  min_trade_usd: 1.0
  # سقف الصفقة الواحدة. ينطبق على الشراء فقط — لا يمنع البيع أبداً،
  # وإلا حُبس البوت في مركز لا يستطيع الخروج منه.
  # Per-trade ceiling. Applies to BUYS only — it must never block an exit.
  max_trade_usd: 500.0
  confirm_blocks: 1
  retry_attempts: 2
  rollback_on_failure: true

  # ── رأس المال / Capital ────────────────────────────────────────────────
  # wallet = اقرأ الرصيد الحقيقي من محفظة MoonPay كل دورة (الموصى به).
  # ledger = استخدم رقم الدفتر المحلي فقط.
  capital_source: wallet
  # ثواني بين قراءتين للرصيد (لتجنّب استهلاك حدّ الطلبات).
  capital_sync_ttl_sec: 60
  # إذا فشلت قراءة المحفظة، كم ثانية نبقى نستخدم آخر قراءة صحيحة.
  # بعدها يُمنع فتح أي مركز حتى تعود القراءة — حماية لأموالك:
  # البوت يرفض التخمين بدلاً من التداول برقم وهمي.
  # Grace window for a stale-but-valid wallet reading. After it expires, LIVE
  # position sizing is BLOCKED rather than guessed.
  capital_sync_grace_sec: 300
  # رصيد SOL المحجوز لرسوم الشبكة فقط (لا يُستخدم في الشراء).
  # SOL kept aside for network fees; never spent on entries.
  sol_fee_reserve: 0.02

  # ── قابلية التداول / Tradability ───────────────────────────────────────
  # MoonPay يوجّه الصفقات عبر swaps.xyz (مجمِّع سيولة لامركزي)، ولا توجد قائمة
  # «50 عملة مسموحة» للتبديل — دليل MoonPay الرسمي لقنص pump.fun ينفّذ
  # `mp token swap` على عملات مُطلَقة حديثاً بعناوين عشوائية. لكن التوافر يعتمد
  # على السيولة الفعلية، وMoonPay نفسها تنصّ على أنها «لا تضمن توافر التبديل».
  # هذه المدة ننتظرها قبل إعادة فحص نفس العملة، حتى لا نحرق حدّ الطلبات على طريق مسدود.
  # MoonPay routes swaps through swaps.xyz (a decentralised liquidity
  # aggregator). There is NO 50-token whitelist for swaps — MoonPay's own
  # pump.fun sniper guide runs `mp token swap` against freshly launched
  # arbitrary mints. Availability does depend on real liquidity, and MoonPay
  # states it "does not guarantee the availability of token swaps".
  # Cooldown before re-checking a token that had no route.
  not_routable_cooldown_sec: 3600
  # عند فشل طلب السعر، نستدعي `mp token check` (فحص MoonPay الموصى به) لنميّز
  # بين «MoonPay لا يعرف هذه العملة» (TOKEN_NOT_SUPPORTED) و«يعرفها لكن لا مسار
  # عند هذا الحجم» (NO_ROUTE). يُستهلك طلباً إضافياً عند الفشل فقط، لا لكل عملة.
  # On a failed quote, run `mp token check` (MoonPay's recommended pre-trade
  # check) to distinguish "mint not recognised" from "no route at this size".
  # Costs one extra request only on failure, never per candidate.
  diagnose_no_route: true

  # ── مسار برنامج MoonPay / CLI path ─────────────────────────────────────
  # اتركه فارغاً ليبحث البوت تلقائياً في PATH و nvm و npm global.
  # ضع المسار الكامل هنا إن كان التثبيت في مكان غير معتاد، مثال:
  #   moonpay_bin: /home/you/.npm-global/bin/mp
  # Leave empty to auto-detect; set a full path if installed somewhere unusual.
  moonpay_bin: ""

  # ── اسم السلسلة كما يريده MoonPay / MoonPay's chain identifier ────────────
  # مهم: مفتاح `chain:` العام في أعلى هذا الملف مضبوط على "sol" لأن برنامج
  # GMGN يسمّي سولانا كذلك. لكن MoonPay يسميها "solana" ويرفض "sol" بالرسالة:
  #     Chain definition not found: sol
  # البوت يترجم الاسم تلقائياً عند كل استدعاء لـ MoonPay، فلا حاجة لتغيير
  # `chain:` (تغييره سيكسر GMGN). اضبط هذا المفتاح فقط إذا طلب MoonPay يوماً
  # اسماً مختلفاً. فارغ = ترجمة تلقائية.
  # IMPORTANT: the shared `chain:` key at the top of this file is "sol" because
  # that is GMGN's spelling. MoonPay's is "solana" and it rejects "sol". Enzo
  # translates automatically at every MoonPay boundary, so do NOT change
  # `chain:` (that would break GMGN). Set this only if MoonPay ever wants a
  # different identifier. Empty = translate automatically.
  moonpay_chain: ""

  # ── النقل المحلي (اختياري، مغلق افتراضياً) / local API (optional) ──────
  # تشغيل `mp serve` يعطي واجهة HTTP محلية. البوت يستخدم CLI مباشرة بشكل
  # افتراضي لأنه أبسط وأسهل تشخيصاً داخل workspace.
  use_local_api: false
  local_api_url: http://127.0.0.1:8787
  local_api_timeout_sec: 45
